name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all scripts
        run: |
          python -m py_compile scripts/*.py
          echo "All Python files compile."

      - name: CLI entry point responds
        run: python scripts/02_cellbender_remove_background.py --help

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse shell scripts
        run: |
          bash -n run_pipeline.sh
          bash -n scripts/03_ptrepack_for_r.sh
          echo "All shell scripts parse."

  r:
    name: R syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Parse R scripts
        run: |
          status=0
          for f in scripts/*.R; do
            if Rscript -e "parse(file='$f')" >/dev/null 2>&1; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              Rscript -e "parse(file='$f')"
              status=1
            fi
          done
          exit $status
